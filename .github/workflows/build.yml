name: Build Heedar TV (Luxury Left Edition)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Build APK
        run: |
          flutter create --org com.heedar --project-name heedar_tv app
          cd app
          flutter pub add video_player shared_preferences http wakelock_plus uuid cached_network_image url_launcher
          cp ../lib/main.dart lib/main.dart
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeedarTV-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
