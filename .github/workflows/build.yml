name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build App
        run: |
          flutter create --org com.heedar --project-name heedar_tv app
          cd app
          flutter pub add video_player shared_preferences http wakelock_plus uuid cached_network_image google_fonts
          flutter pub add flutter_localizations --sdk=flutter
          cp ../lib/main.dart lib/main.dart
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.WAKE_LOCK"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          flutter build apk --release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: HeedarTV-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
