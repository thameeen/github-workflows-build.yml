name: Build Heedar TV (Final Logo Clean)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clean Wordmark Logo & Rebrand
        run: |
          # 1. تنزيل نسخة OwnTV الرسمية المستقرة
          curl -L -o owntv.apk https://github.com/ahXN00/OwnTV/releases/latest/download/OwnTV.apk
          
          # 2. تنزيل أدوات التعديل والتوقيع
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -O apktool.jar
          wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O signer.jar
          
          # 3. فك التطبيق
          java -jar apktool.jar d -s -f owntv.apk -o owntv_decompiled
          
          # 4. تجهيز صورة شفافة لاستبدال اللوجو
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > /tmp/transparent.png
          
          # 5. التعديل في النصوص + إخفاء رسمة لوجو owntv كلياً
          python3 -c "
          import os, re

          res_dir = 'owntv_decompiled/res'
          blank_vector = '<vector xmlns:android=\"http://schemas.android.com/apk/res/android\" android:width=\"1dp\" android:height=\"1dp\" android:viewportWidth=\"1\" android:viewportHeight=\"1\"/>'

          for root, _, files in os.walk(res_dir):
              for f in files:
                  p = os.path.join(root, f)
                  low = f.lower()

                  # أ. تعديل النصوص في strings.xml
                  if f == 'strings.xml':
                      with open(p, 'r', encoding='utf-8', errors='ignore') as fp:
                          c = fp.read()
                      def repl(m):
                          val = m.group(1)
                          if not val.strip().startswith('@'):
                              val = val.replace('OwnTV', 'Heedar TV').replace('owntv', 'Heedar TV').replace('OWNTV', 'Heedar TV')
                          return '>' + val + '<'
                      c2 = re.sub(r'>([^<]+)<', repl, c)
                      if c2 != c:
                          with open(p, 'w', encoding='utf-8') as fp:
                              fp.write(c2)

                  # ب. إخفاء رسمة الشعار Wordmark المصورة تماماً
                  if 'wordmark' in low or 'lockup' in low or ('owntv' in low and ('logo' in low or 'mark' in low)):
                      if f.endswith('.xml'):
                          with open(p, 'w', encoding='utf-8') as fp:
                              fp.write(blank_vector)
                      elif f.endswith('.png'):
                          with open('/tmp/transparent.png', 'rb') as src, open(p, 'wb') as dst:
                              dst.write(src.read())
          "
          
          sed -i 's/android:label="OwnTV"/android:label="Heedar TV"/g' owntv_decompiled/AndroidManifest.xml || true
          
          # 6. تجميع وتوقيع التطبيق رسمياً
          java -jar apktool.jar b owntv_decompiled -o heedar_unsigned.apk
          java -jar signer.jar -a heedar_unsigned.apk --allowResign -o output/
          mv output/*.apk HeedarTV-APK.apk

      - name: Upload Heedar TV APK
        uses: actions/upload-artifact@v4
        with:
          name: HeedarTV-APK
          path: HeedarTV-APK.apk
